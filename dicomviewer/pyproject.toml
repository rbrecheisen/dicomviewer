[project]
name = "dicomviewer"
version = "0.1.0"
description = ""
authors = [
    {name = "Brecheisen", email = "r.brecheisen@maastrichtuniversity.nl"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rbeesoft==2.0.0",
]

[tool.poetry]
packages = [{include = "dicomviewer", from = "src"}]

[tool.poetry.scripts]
dicomviewer = "dicomviewer.main:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pyinstaller = "^6.17.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
